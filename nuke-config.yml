regions:
  - global
  - us-east-1
  - us-east-2
  - us-west-1
  - us-west-2
  - ca-central-1
  - sa-east-1
  - eu-west-1
  - eu-west-2
  - eu-west-3
  - eu-central-1
  - eu-north-1
  - ap-south-1
  - ap-southeast-1
  - ap-southeast-2
  - ap-northeast-1
  - ap-northeast-2
  - ap-northeast-3

blocklist:
  - "000000000000" 

bypass-alias-check-accounts:
  - "649872913223"
  - "386347569109"
  - "614084726772"
  - "000000000000"

accounts:
  "649872913223":
    presets:
      - elasticache-service-defaults
    filters:
      IAMUser:
        - "admin-user"
      IAMUserPolicyAttachment:
        - "admin-user -> AdministratorAccess"
      IAMUserAccessKey:
        - "admin-user -> AKIAZOT3RWNDYNPQTWXF"
      IAMVirtualMFADevice:
        - "arn:aws:iam::649872913223:mfa/admin-user"
  "386347569109":
    presets:
      - elasticache-service-defaults
    filters:
      IAMUser:
        - "root"
      IAMUserPolicyAttachment:
        - "root -> AdministratorAccess"
      IAMUserAccessKey:
        - "root -> AKIAVT5A4B7KZGUUIRNH"
  "614084726772":
    presets:
      - elasticache-service-defaults
    filters:
      IAMUser:
        - "senatwo"
      IAMUserPolicyAttachment:
        - "senatwo -> AdministratorAccess"
      IAMUserAccessKey:
        - "senatwo -> AKIAY56SNJ72OXQLKPXT"

presets:
  # ElastiCache creates default.iam-user / default.iam-user-group itself in
  # every region (no CreateUser/CreateUserGroup API call in CloudTrail), and
  # the API then rejects their dotted IDs as invalid on delete -- so aws-nuke
  # can only ever fail on them. They're free; filter them so runs exit clean.
  elasticache-service-defaults:
    filters:
      ElasticacheUser:
        - "default.iam-user"
      ElasticacheUserGroup:
        - "default.iam-user-group"
